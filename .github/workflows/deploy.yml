name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install pygbag pygame

      # --ume_block 0 starts the game immediately instead of waiting for a
      # click to unlock audio; sound still enables itself on first interaction.
      - name: Build WebAssembly game
        run: pygbag --build --disable-sound-format-error --ume_block 0 src

      # pygbag can fail without a non-zero exit code, which would silently
      # redeploy a stale build. Fail loudly instead.
      - name: Verify build output
        run: |
          for f in index.html src.apk src.tar.gz; do
            if [ ! -s "src/build/web/$f" ]; then
              echo "::error::pygbag did not produce src/build/web/$f"
              exit 1
            fi
          done
          ls -lh src/build/web

      - name: Create Cloudflare Pages Project
        run: npx wrangler pages project create chess2 --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy src/build/web --project-name chess2
